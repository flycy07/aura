<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Aura — Lettore musicale offline</title>
    <meta
      name="description"
      content="Lettore musicale offline per iPhone: i tuoi file, nessuna pubblicità, nessun tracciamento."
    />
    <meta name="theme-color" content="#07070b" />
    <!-- YouTube incorporato: senza referer l'embed rifiuta la riproduzione (errore 153). -->
    <meta name="referrer" content="origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>

    <!-- ELEMENTO AGGIUNTIVO: Tag audio nativo globale per la riproduzione in background e a schermo spento -->
    <audio id="audioPlayer" preload="auto" style="display: none;"></audio>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
